# Fast checks for pull requests and main: formatting and tests only, no
# packaging. Installers are built and tested by release.yml (version tags) or
# on demand by running the Build workflow manually.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  checks:
    name: Format and resolver tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo fmt --all --check
      - run: cargo fmt --check --manifest-path tools/icon-gen/Cargo.toml
      - run: bash scripts/version.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The resolver library builds without the GUI stack.
      - run: cargo test --locked --no-default-features --lib

  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-2025
            cache: windows-x64
            args: ""
          - name: macOS
            runner: macos-15
            cache: macos-arm64
            args: --target aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      # Same key, profile and target as the release build, so tests on main
      # warm the dependency cache that release builds restore.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.cache }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked --release ${{ matrix.args }}
