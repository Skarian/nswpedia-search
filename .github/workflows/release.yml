# Push a tag matching Cargo.toml (e.g. v0.2.0-rc.1) to build every platform and
# create a DRAFT GitHub Release. Nothing is published automatically: review
# the draft and publish it by hand. -rc tags are marked as prereleases.
name: Release
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          eval "$(bash scripts/version.sh)"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION (expected v$VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      release: true

  draft-release:
    name: Draft GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Check assets and write checksums
        working-directory: assets
        run: |
          expected=(
            "nswpedia-search-$VERSION-windows-x64-setup.exe"
            "nswpedia-search-$VERSION-windows-x64-portable.zip"
            "nswpedia-search-$VERSION-macos-arm64.dmg"
            "nswpedia-search-$VERSION-macos-x64.dmg"
          )
          ls -la
          for f in "${expected[@]}"; do
            [[ -s $f ]] || { echo "::error::Missing $f"; exit 1; }
          done
          [[ $(ls | wc -l) -eq ${#expected[@]} ]] || { echo "::error::Unexpected files in artifacts"; exit 1; }
          sha256sum "${expected[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        run: |
          {
            sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md
            echo
            echo '```text'
            cat assets/SHA256SUMS.txt
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          flags=()
          if [[ $PRERELEASE == true ]]; then flags+=(--prerelease); fi
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            # Re-run for the same tag: refresh the draft, never touch a published release.
            [[ $draft == true ]] || { echo "::error::$tag is already published"; exit 1; }
            gh release upload "$tag" assets/* --clobber
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          else
            gh release create "$tag" assets/* --draft --verify-tag "${flags[@]}" \
              --title "NSWpedia Search $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
