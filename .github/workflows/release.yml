# Push a tag matching Cargo.toml (e.g. v0.1.1) to build and test every platform
# and, only if everything passes, publish a GitHub Release with the installers.
# X.Y.Z tags become the Latest release; X.Y.Z-rc.N tags are prereleases.
name: Release
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          eval "$(bash scripts/version.sh)"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION (expected v$VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      release: true

  publish:
    name: Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          # Not "assets": that is the repo's icon folder in the checkout.
          path: release-assets
          merge-multiple: true
      - name: Check assets and write checksums
        working-directory: release-assets
        run: |
          expected=(
            "nswpedia-search-$VERSION-windows-x64-setup.exe"
            "nswpedia-search-$VERSION-windows-x64-portable.zip"
            "nswpedia-search-$VERSION-macos-arm64.dmg"
            "nswpedia-search-$VERSION-macos-x64.dmg"
          )
          ls -la
          for f in "${expected[@]}"; do
            [[ -s $f ]] || { echo "::error::Missing $f"; exit 1; }
          done
          [[ $(ls | wc -l) -eq ${#expected[@]} ]] || { echo "::error::Unexpected files in artifacts"; exit 1; }
          sha256sum "${expected[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        run: |
          {
            sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md
            echo
            echo '```text'
            cat release-assets/SHA256SUMS.txt
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          # Stable versions become the repository's Latest release; -rc tags are
          # prereleases and leave Latest unchanged.
          if [[ $PRERELEASE == true ]]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--prerelease=false --latest)
          fi
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            # Left over from an interrupted run: refresh it. Never touch a published release.
            [[ $draft == true ]] || { echo "::error::$tag is already published"; exit 1; }
            gh release upload "$tag" release-assets/* --clobber
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          else
            # Upload everything to a draft first so the release never appears half-filled.
            gh release create "$tag" release-assets/* --draft --verify-tag \
              --title "NSWpedia Search $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release edit "$tag" --draft=false "${flags[@]}"
          gh release view "$tag" --json url,isPrerelease --jq '"Published \(.url) (prerelease: \(.isPrerelease))"'
