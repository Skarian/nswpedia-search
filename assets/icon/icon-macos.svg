<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS variant: 824 px body on the 1024 grid with a soft shadow, per the
       macOS app icon template. Artwork matches icon.svg. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1c20"/>
      <stop offset="1" stop-color="#0e0f11"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" stroke="#30343a" stroke-width="6" filter="url(#shadow)"/>
  <g transform="translate(512 512) scale(0.928) translate(-512 -512)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="452" cy="452" r="196" stroke="#8fcf9f" stroke-width="60"/>
    <line x1="604" y1="604" x2="756" y2="756" stroke="#8fcf9f" stroke-width="84"/>
    <polyline points="378,396 434,452 378,508" stroke="#d6d8dc" stroke-width="36"/>
    <line x1="470" y1="508" x2="530" y2="508" stroke="#8fcf9f" stroke-width="36"/>
  </g>
</svg>
