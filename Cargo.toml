[package]
name = "nswpedia-search"
version = "0.2.0-rc.1"
edition = "2024"
rust-version = "1.92"
description = "Native NSWpedia search and 1fichier link resolver"
license = "MIT"
default-run = "nswpedia-search"

[dependencies]
anyhow = "1"
async-channel = "2"
directories = "6"
gpui-kit = { version = "=0.7.3", optional = true }
html-escape = "0.2"
keyring = { version = "3", optional = true }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

# OS credential stores for the Real-Debrid API key (Windows Credential
# Manager, macOS Keychain). Other platforms fall back to an in-memory store.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", optional = true, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native"] }

[build-dependencies]
# Windows icon and version resources (no-op on other targets).
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit", "dep:keyring"]

[[bin]]
name = "nswpedia-search"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"

[[bin]]
name = "nswpedia-check"
path = "src/check.rs"
